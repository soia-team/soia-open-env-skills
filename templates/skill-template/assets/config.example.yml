# Generic config example for your-skill-name.
# Copy to the config path returned by:
# python3 scripts/resolve_storage.py --json
# or point YOUR_SKILL_CONFIG_FILE to it.
# This file is for non-secret settings only. Store provider auth in the
# provider-owned login flow or the operating-system credential store.

version: 1

paths:
  workspace_env: YOUR_SKILL_WORKSPACE
  output_root: outputs/your-skill-name

defaults:
  provider: auto
  dry_run: false
  update_source: false

providers:
  local:
    enabled: true
  external_provider:
    enabled: auto
    install_policy: prompt
    command: <command-name>
    auth_check: <safe-readonly-auth-check>

authentication:
  policy: provider_login_or_os_keychain
  profile: default

env:
  # Optional non-secret process settings the resolver may load.
  YOUR_SKILL_MODE: "default"
