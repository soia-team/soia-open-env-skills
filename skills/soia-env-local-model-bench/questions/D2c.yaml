# D2c · 数学推理 · D2 参数扰动变体，防记忆污染（有确定答案：244）。取结尾 300 字符做正则判定。
qid: D2c
cat: 数学推理
temp: 0.0
max_tokens: 3000
check:
  type: regex
  tail: 300
  any_patterns:
    - '最终答案[^0-9\n]{0,8}244(?!\d)'
    - '(?<!\d)244(?!\d)'
prompt: |
  1 到 800 中，是 4 或 9 的倍数、但不是 36 的倍数的整数有多少个？
  请逐步推理，最后单独一行按「最终答案：<数字>」的格式给出最终数字。
mock_response: |
  1 到 800 中：4 的倍数有 800 ÷ 4 = 200 个；9 的倍数有 ⌊800 ÷ 9⌋ = 88 个；36 的倍数有 ⌊800 ÷ 36⌋ = 22 个。
  是 4 或 9 的倍数的共有 200 + 88 - 22 = 266 个。
  再去掉 36 的倍数：266 - 22 = 244 个。
  最终答案：244
