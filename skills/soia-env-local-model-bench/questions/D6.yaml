# D6 · 数学推理 · GSM-Symbolic 风格原创题（工程合作，原创数值，答案：7 天）。取结尾 300 字符做正则判定。
qid: D6
cat: 数学推理
temp: 0.0
max_tokens: 3000
check:
  type: regex
  tail: 300
  any_patterns:
    - '最终答案[^0-9\n]{0,8}(?:7(?!\d)|七)'
    - '(?<!\d)7(?:\.0+)?\s*天'
    - '(?<!十)七\s*天'
prompt: |
  一项工程，甲单独做需要 18 天完成，乙单独做需要 12 天完成。两人先合作 3 天，之后甲因事离开，剩下的部分由乙单独完成。乙还需要单独做多少天？
  请逐步推理，最后单独一行按「最终答案：<数字> 天」的格式给出最终答案。
mock_response: |
  设总工程量为 36 份（18 和 12 的最小公倍数）。
  甲每天完成 36 ÷ 18 = 2 份，乙每天完成 36 ÷ 12 = 3 份。
  合作 3 天完成 (2 + 3) × 3 = 15 份，剩余 36 - 15 = 21 份。
  乙单独完成剩余部分需要 21 ÷ 3 = 7 天。
  验算：分数法，合作 3 天完成 3 × 5/36 = 5/12，剩余 7/12，乙每天完成 1/12，需 (7/12) ÷ (1/12) = 7 天。
  最终答案：7 天
