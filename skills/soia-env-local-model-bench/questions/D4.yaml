# D4 · 数学推理 · GSM-Symbolic 风格原创题（购物折扣，原创数值，答案：161 元）。取结尾 300 字符做正则判定。
qid: D4
cat: 数学推理
temp: 0.0
max_tokens: 3000
check:
  type: regex
  tail: 300
  any_patterns:
    - '最终答案[^0-9\n]{0,8}161(?!\d)'
    - '(?<!\d)161(?:\.0+)?\s*元'
prompt: |
  书店里一本精装书原价 85 元，正在打八折促销。李阿姨持会员卡，可以在八折价的基础上每本再减 6 元。她一次买了 3 本这样的精装书，结账时又使用了一张「满 180 元减 25 元」的优惠券。她实际支付了多少元？
  请逐步推理，最后单独一行按「最终答案：<数字> 元」的格式给出最终答案。
mock_response: |
  每本八折价：85 × 0.8 = 68 元。
  会员再减 6 元：68 - 6 = 62 元。
  3 本合计：62 × 3 = 186 元。
  186 元已满 180 元，可用优惠券再减 25 元：186 - 25 = 161 元。
  最终答案：161 元
