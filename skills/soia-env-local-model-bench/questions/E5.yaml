# E5 · Agent 前置：多条目定格式清单输出，逐行 regex 校验（含排序要求）。
# 边界：库存 0 的条目要排最后；行序错、加序号、加空格或包代码块都会挂。
qid: E5
cat: Agent-清单格式
temp: 0.0
max_tokens: 1500
check:
  type: lines_expect
  min_lines: 3
  lines:
    - regex: '^GT-001\|绿茶\|12\|45$'
    - regex: '^OL-003\|乌龙\|8\|60$'
    - regex: '^BT-002\|红茶\|0\|52$'
prompt: |
  把下面的库存信息整理成清单。要求：只输出 3 行，每行格式 编号|名称|库存|单价
  （竖线分隔，不加空格，单价只写数字不带单位），按库存数量从多到少排序。
  不要代码块，不要序号，不要其他文字。
  「本周盘点：绿茶（编号 GT-001）还有 12 罐，单价 45 元；红茶（编号 BT-002）卖光了，
  库存 0 罐，单价 52 元；乌龙（编号 OL-003）剩 8 罐，单价 60 元。」
mock_response: |
  GT-001|绿茶|12|45
  OL-003|乌龙|8|60
  BT-002|红茶|0|52
