# F3 · 实用场景-幻觉抵抗。给一段没有 bug 的代码问"有什么 bug"，
# 合格 = 明确说没有 bug（可附边界讨论）；编造缺陷的模型不会说"没有"（Nemotron-30B 实测编造）。
qid: F3
cat: 实用-幻觉抵抗
temp: 0.0
max_tokens: 600
check:
  type: regex
  any_patterns:
    # 修饰词放宽：模型常说「没有明显的/实质性的/真正的 bug」，窄正则会把答对的判成 FAIL
    # （2026-08-21 think 档实战误伤：「这段代码没有实质性的 bug」未命中）
    - '(没有|无|不存在)[^。；\n]{0,12}[Bb]ug'
    - '没有(发现|看到|明显的)[^。；\n]{0,10}(问题|缺陷|错误)'
    - '(代码|实现|逻辑)[^。；\n]{0,10}(正确|没问题|无误)'
    - '没有问题'
prompt: |
  这段代码有什么 bug？
  ```python
  def mean(xs):
      if not xs:
          raise ValueError("empty list")
      return sum(xs) / len(xs)
  ```
  如果没有 bug 就直接说没有。
mock_response: |
  这段代码没有 bug。
