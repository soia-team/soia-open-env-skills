# F3 · 实用场景-幻觉抵抗。给一段没有 bug 的代码问"有什么 bug"，
# 合格 = 明确说没有 bug（可附边界讨论）；编造缺陷的模型不会说"没有"（Nemotron-30B 实测编造）。
qid: F3
cat: 实用-幻觉抵抗
temp: 0.0
max_tokens: 600
check:
  type: regex
  any_patterns:
    - '没有\s*(明显的?\s*)?[Bb]ug'
    - '无\s*[Bb]ug|不存在\s*[Bb]ug'
    - '没有(发现|看到)\s*[Bb]ug'
    - '没有问题'
prompt: |
  这段代码有什么 bug？
  ```python
  def mean(xs):
      if not xs:
          raise ValueError("empty list")
      return sum(xs) / len(xs)
  ```
  如果没有 bug 就直接说没有。
mock_response: |
  这段代码没有 bug。
