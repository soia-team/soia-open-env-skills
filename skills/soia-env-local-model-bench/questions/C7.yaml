# C7 · 真实代码-公开：HumanEval+ 风格原创题（简单状态机）——文档审批流转。
# 边界：空事件序列、终态后事件全无效、未知事件名计无效（拦只认已知事件的实现）、非法转移不改状态、驳回重提循环。
qid: C7
cat: 真实代码-公开
temp: 0.0
