# D3a · 逻辑陷阱：小数比大小。正则判定为启发式：结尾出现 9.9 胜出表述、
# 且全文没有「9.11 更大」类表述才算过；含糊输出请人工复核。
qid: D3a
cat: 逻辑陷阱
temp: 0.0
max_tokens: 2000
check:
  type: regex
  tail: 200
  any_patterns:
    - '9\.9\s*(更大|大于|比\s*9\.11\s*大)'
    - '9\.9'
  reject: '9\.11\s*(更大|大于)'
prompt: |
  9.11 和 9.9 这两个数哪个更大？
mock_response: |
  比较小数部分：0.9 > 0.11，所以 9.9 更大。
