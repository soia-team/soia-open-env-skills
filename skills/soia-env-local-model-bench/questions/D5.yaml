# D5 · 数学推理 · GSM-Symbolic 风格原创题（行程相遇，原创数值，答案：160 千米）。取结尾 300 字符做正则判定。
qid: D5
cat: 数学推理
temp: 0.0
max_tokens: 3000
check:
  type: regex
  tail: 300
  any_patterns:
    - '最终答案[^0-9\n]{0,8}160(?!\d)'
    - '(?<!\d)160(?:\.0+)?\s*(?:千米|公里|km)'
prompt: |
  甲、乙两地相距 310 千米。一辆货车以 60 千米/小时的速度从甲地开往乙地；货车出发 30 分钟后，一辆轿车以 80 千米/小时的速度从乙地开往甲地。两车相遇时，轿车一共行驶了多少千米？
  请逐步推理，最后单独一行按「最终答案：<数字> 千米」的格式给出最终答案。
mock_response: |
  货车先行 30 分钟即 0.5 小时，行驶 60 × 0.5 = 30 千米。
  轿车出发时，两车相距 310 - 30 = 280 千米。
  两车相向而行，速度和 60 + 80 = 140 千米/小时，还需 280 ÷ 140 = 2 小时相遇。
  轿车行驶 80 × 2 = 160 千米。
  验算：货车共行驶 60 × 2.5 = 150 千米，150 + 160 = 310 千米，与两地距离一致。
  最终答案：160 千米
