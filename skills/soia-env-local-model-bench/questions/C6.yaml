prompt: |
  实现一个 js 函数，签名 coveredMinutes(intervals)：输入字符串数组，每项形如 "HH:MM-HH:MM"
  （24 小时制，同一天内，保证开始<=结束），数组可能无序、区间之间可能重叠或包含。
  返回这些时间段在时间轴上覆盖的总分钟数，重叠部分只算一次；空数组返回 0。
  例：coveredMinutes(["09:00-11:00","10:00-12:00"]) === 180。
  只输出这一个函数，一个 js 代码块，不要解释。
mock_response: |
  ```js
  function coveredMinutes(intervals) {
    const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
    const parsed = intervals
      .map(s => { const [a, b] = s.split("-"); return [toMin(a), toMin(b)]; })
      .sort((x, y) => x[0] - y[0]);
    let total = 0, curS = null, curE = null;
    for (const [s, e] of parsed) {
      if (curS === null) { curS = s; curE = e; continue; }
      if (s <= curE) { curE = Math.max(curE, e); }
      else { total += curE - curS; curS = s; curE = e; }
    }
    if (curS !== null) total += curE - curS;
    return total;
  }
  ```
