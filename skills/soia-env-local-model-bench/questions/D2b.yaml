# D2b · 数学推理 · D2 参数扰动变体，防记忆污染（有确定答案：457）。取结尾 300 字符做正则判定。
qid: D2b
cat: 数学推理
temp: 0.0
max_tokens: 3000
check:
  type: regex
  tail: 300
  any_patterns:
    - '最终答案[^0-9\n]{0,8}457(?!\d)'
    - '(?<!\d)457(?!\d)'
prompt: |
  1 到 1200 中，是 3 或 7 的倍数、但不是 21 的倍数的整数有多少个？
  请逐步推理，最后单独一行按「最终答案：<数字>」的格式给出最终数字。
mock_response: |
  1 到 1200 中：3 的倍数有 1200 ÷ 3 = 400 个；7 的倍数有 ⌊1200 ÷ 7⌋ = 171 个；21 的倍数有 ⌊1200 ÷ 21⌋ = 57 个。
  是 3 或 7 的倍数的共有 400 + 171 - 57 = 514 个。
  再去掉 21 的倍数：514 - 57 = 457 个。
  最终答案：457
