# D8 · 数学推理 · GSM-Symbolic 风格原创题（利润分成，原创数值，答案：11 万元）。取结尾 300 字符做正则判定。
qid: D8
cat: 数学推理
temp: 0.0
max_tokens: 3000
check:
  type: regex
  tail: 300
  any_patterns:
    - '最终答案[^0-9\n]{0,8}11(?!\d)'
    - '(?<!\d)11(?:\.0+)?\s*万'
prompt: |
  张、王两人合伙开店，张出资 6 万元，王出资 4 万元。年底结算时，两人约定：先从总利润中拿出 2 万元作为门店维修基金，剩余利润再按出资比例分配。结果张比王多分得 1.8 万元。这一年的总利润是多少万元？
  请逐步推理，最后单独一行按「最终答案：<数字> 万元」的格式给出最终答案。
mock_response: |
  出资比例为 6 : 4 = 3 : 2。设扣除维修基金后的剩余利润为 R 万元。
  张分得 (3/5)R，王分得 (2/5)R，两人相差 (1/5)R = 1.8 万元，所以 R = 9 万元。
  总利润 = 剩余利润 + 维修基金 = 9 + 2 = 11 万元。
  验算：剩余 9 万元按 3 : 2 分，张得 5.4 万元，王得 3.6 万元，相差 1.8 万元，符合题意。
  最终答案：11 万元
