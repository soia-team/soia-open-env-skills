# D7 · 数学推理 · GSM-Symbolic 风格原创题（浓度配比，原创数值，答案：270 克）。取结尾 300 字符做正则判定。
qid: D7
cat: 数学推理
temp: 0.0
max_tokens: 3000
check:
  type: regex
  tail: 300
  any_patterns:
    - '最终答案[^0-9\n]{0,8}270(?!\d)'
    - '(?<!\d)270(?:\.0+)?\s*克'
prompt: |
  实验室现有浓度为 30% 的盐水 180 克。要把它稀释成浓度为 12% 的盐水，需要加入多少克清水？
  请逐步推理，最后单独一行按「最终答案：<数字> 克」的格式给出最终答案。
mock_response: |
  盐的质量：180 × 30% = 54 克，稀释过程中盐的质量不变。
  设加入 x 克清水，则 54 ÷ (180 + x) = 12%，即 180 + x = 54 ÷ 0.12 = 450 克。
  所以 x = 450 - 180 = 270 克。
  验算：加水后总质量 450 克，含盐 54 克，浓度 54 ÷ 450 = 12%，符合要求。
  最终答案：270 克
