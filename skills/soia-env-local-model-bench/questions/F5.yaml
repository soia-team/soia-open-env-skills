# F5 · 实用场景-摘要。摘要质量自动判定不可靠，save 落盘人工评审
# （评审要点：核心数字保留且不错、因果链不颠倒、无编造）。
qid: F5
cat: 实用-摘要
temp: 0.0
max_tokens: 300
check:
  type: save
  ext: md
prompt: |
  用一句话摘要：M4 Max 的统一内存带宽是 546GB/s。decode 阶段每生成一个 token 都要完整读一遍模型权重，因此 decode 速度上限约等于带宽除以权重大小。一个 28G 的 8bit 模型理论上限约 19 tok/s，实测 15.4，达到理论值的 80%。这意味着配置层几乎没有优化空间，想加速只能换更小权重、换 MoE 架构或用投机解码摊销权重读取。
mock_response: |
  内存带宽决定 decode 上限，28G 模型实测达理论值 80%，提速只能靠小权重/MoE/投机解码。
