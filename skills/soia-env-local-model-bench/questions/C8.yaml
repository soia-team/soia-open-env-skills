# C8 · 真实代码-公开：HumanEval+ 风格原创题（数据聚合）——订单按商品聚合并排序。
# 边界：空数组、同名多单价聚合、revenue 并列走名称升序（拦漏 tie-break）、负数量退货净零仍保留、qty 为 0。
